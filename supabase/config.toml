# A string used to distinguish different Supabase projects on the same host.
project_id = "mqffqoirvbiynwrzwwse"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Email testing server. Messages sent with the local dev stack are
# captured here instead of being delivered.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://127.0.0.1:8080", "http://localhost:8080"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Disabled locally so signups work without clicking a confirmation link.
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.ai-chat]
verify_jwt = false

[functions.ai-chat-guest]
verify_jwt = false

[functions.ai-voice]
verify_jwt = false

[functions.send-event-reminder]
verify_jwt = false

[functions.create-user]
verify_jwt = false

[functions.setup-admin]
verify_jwt = false

[functions.delete-user]
verify_jwt = false

[functions.cleanup-notifications]
verify_jwt = false
